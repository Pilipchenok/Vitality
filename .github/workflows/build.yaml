name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Сборка на ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установка графических библиотек Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev build-essential pkg-config

      - name: Сборка фронтенда
        run: |
          cd frontend
          npm install
          npm run build

      - name: Сборка для macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p bin
          go build -o bin/Vitality .

      - name: Сборка для Windows
        if: runner.os == 'Windows'
        run: |
          mkdir bin
          go build -ldflags "-H windowsgui" -o bin/Vitality.exe .

      - name: Сборка для Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p bin
          go build -o bin/Vitality .

      - name: Сохранение готовых программ
        uses: actions/upload-artifact@v4
        with:
          name: Monitor-${{ runner.os }}
          path: bin/*
