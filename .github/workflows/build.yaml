name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Сборка на ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установка графических библиотек Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config

      - name: Установка Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Сборка для macOS (Universal)
        if: runner.os == 'macOS'
        run: wails build -platform darwin/universal -clean

      - name: Сборка для Windows и Linux
        if: runner.os != 'macOS'
        run: wails build -clean

      - name: Сохранение готовых программ
        uses: actions/upload-artifact@v4
        with:
          name: Monitor-${{ runner.os }}
          path: build/bin/*
